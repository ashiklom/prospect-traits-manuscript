dataset_id: amaranth_leaf_canopy_2013
source: ecosis
source_id: spectral-variation-between-leaf-level-and-canopy-level-measurements-
# Mazur (Townsend lab), Walnut Street Greenhouse, Madison WI, spring 2013. 24 amaranth plants.
# Kept: leaf-level spectra ("Plant NN" rows; ASD FS3, plant probe + leaf clip), each the
# mean of a plant's leaf measurements. Dropped: "Group"/"Sequential" rows (canopies of 1-4
# plants, bare fiber pistol grip). No traits.
# Species: USDA code AMHY (Amaranthus hypochondriacus), but the description says
# "Red Amaranth (Amaranthus blitum)" -> genus only.
# "F_BASELINE" plants (19, 20, 22, 23) belong to the fertilized group. "Baseline"
# suggests the measurement was taken before fertilization took effect, so they get their own level.
columns:
  fert: "`Fertilization Treatment`.where(~`idstr`.str.contains('BASELINE'), 'Fertalized (baseline)')"
filter:
  - "`Identifier`.str.startswith('Plant')"
spectra:
  quantity: R
  scale: auto
  foreoptic: leaf_clip
  instrument: asd-fs3
  sample_state: fresh
  target_config: single_leaf
  segments: [1001, 1801]
ids:
  entity: [idstr]
  plant: [Identifier]
species: {constant: "Amaranthus"}
date: 2013
site: {name: "Walnut Street Greenhouse, Madison WI"}
lat: 43.07
lon: -89.42
ecosystem: greenhouse
treatments:
  - {factor: nitrogen, column: fert, control: ["Not Fertalized"]}

source_id: leaf-level-spectra-and-lma-for-a-set-of-trees--forbs--vines-and-grasses-collected-in-madison--wi
citation: "Chlus, A. (2019). Leaf level spectra and LMA for a set of trees, forbs, vines and grasses collected in Madison, WI. EcoSIS."
# Summer 2016, Madison WI (Chlus / Townsend lab). Metadata = only id, lma_g_m2, functional_type
# (no species, date, instrument or measurement-number columns).
# 10105 ids; lma_g_m2 is constant within id, so an id is one leaf and its 3-6 rows are
# repeated leaf-clip measurements of that leaf with THREE spectrometers (ASD FieldSpec 3,
# PSR+ 3500, SVC HR-1024i). The export has no instrument column. Spectral fingerprints:
#   ~9083 rows: SVC-like (piecewise-linear 1-nm resampling, 4-decimal nodes, no 2500 nm band)
#   ~15509 rows: values with exactly 6 decimals; ~18462 rows: full float precision
# (ASD vs PSR not determinable). Typical id = one spectrum per instrument, or two each.
# The converter can't assign instrument per row from spectra, so instrument is unknown; the
# SVC rows still end up on their own grid (350-2499 nm).
columns:
  # 3 leaves with LMA < 5 g/m2 (2.7-3.0; next lowest 6.4) are implausible -> missing.
  lma_ok: "`lma_g_m2`.where(`lma_g_m2` >= 5)"

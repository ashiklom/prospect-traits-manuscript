dataset_id: chlus_3d_lma
source: ecosis
source_id: 3d-lma-leaf-level-spectra
citation: "Chlus, A., Kruger, E. L., Townsend, P. A. (2020). Mapping three-dimensional variation in leaf mass per area with imaging spectroscopy and lidar in a temperate broadleaf forest. Remote Sens. Environ. 250, 112043."
# The only ID column ('Unnamed: 0') reads plotNN_YYYY_<tree>_<NNNN>_<leaf>, e.g.
# plot01_2016_tsa_0075_01. Each row has its own LMA, so every row is a separate
# leaf (3 leaves, occasionally 4-5, per tree x sampling point). The 4-digit field is
# probably the sampling height (3D sampling); it has no schema field and is kept
# only inside the entity id. Plant = plot + tree tag.
columns:
  sid: "`Unnamed: 0`"
  plot_: "sid.str.split('_').str[0]"
  year: "sid.str.split('_').str[1].astype('int64')"
  tree: "sid.str.split('_').str[2]"
  pt: "sid.str.rsplit('_', n=1).str[0]"   # sampling point = sid without the leaf number
spectra:
  quantity: R
  scale: auto                        # stored as fraction although metadata says %
  foreoptic: leaf_clip
  # package lists both ASD FieldSpec 3 and SE PSR+ 3500 with no per-spectrum column
  instrument: unknown
  sample_state: fresh
  target_config: single_leaf
ids:
  entity: [sid]
  plant: [plot_, tree]
# Species are not in the spectra export but in the package's field-data resource
# chlus_et_al_3D_LMA_field_data.csv (https://data.ecosis.org/dataset/6a9ded07-4091-416d-a837-
# f0ce8c6587ad/resource/d0ad47ec-c9b0-48a3-b25b-2b773a2f42b2), one row per sampling point
# ('Unnamed: 0' = sid without the trailing leaf number; 810 points, covering all 807 in the
# export). Its genus/species columns are mapped below ('Prunus spp' -> Prunus). Species is per sampling point, not
# per tree tag: saplings 'tsa'/'tsb'/'tsc' and one tree (plot18_2017_t06) mix species.
# plot45_2017 t01-t03: code BEAL but name Betula papyrifera (8 points) -> genus Betula.
# The resource also has location (NHSF, UNDE, CHEQ, OTNF, UNDERC, LNCF), lat/lon, DBH and
# sampling height, not used here.
species:
  name: pt

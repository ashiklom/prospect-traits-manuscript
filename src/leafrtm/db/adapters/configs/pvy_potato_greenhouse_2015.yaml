dataset_id: pvy_potato_greenhouse_2015
source: ecosis
source_id: potato-virus-y-detection-in-solanum-tuberosum--greenhouse-data-
# 80 potato plants (20 per group): control or inoculated with PVY strain O,
# NO or NTN. Six measurement sets (2015-10-16 to 2015-11-13); each row is the
# mean spectrum of 3 (sets 1-3) or 6 (sets 4-6) leaves of one plant.
# The export has NO date / measurement-set column, and the row order does
# not reveal the set (plants are interleaved). meas_index (0-5) = order of
# a plant's rows in the export: it only keeps the spectra apart as separate
# observations; it is NOT guaranteed to equal the measurement set.
# Entity = plant (pooled leaves), plant = Plant_ID.
columns:
  meas_index: "Plant_ID.groupby(Plant_ID).cumcount()"
spectra:
  quantity: R
  scale: auto
  foreoptic: leaf_clip
  instrument: svc-hr1024i
  sample_state: fresh
  target_config: single_leaf
ids:
  entity: [Plant_ID]
  time: [meas_index]
  plant: [Plant_ID]
species: {constant: "Solanum tuberosum"}
date: 2015
site: {name: "UW-Madison Walnut Street Greenhouse"}
lat: 43.075
lon: -89.420
ecosystem: greenhouse
treatments:
  - {factor: pathogen, column: PVY_Strain, control: [Control]}   # PVY-O, PVY-NO, PVY-NTN

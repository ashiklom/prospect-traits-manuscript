include: false
exclude_reason: >-
  Six 2017 ABoVE SVC HR-1024i leaf-clip packages (Vargas-Zesati et al.) sharing one structure. Most
  spectra are radiometrically broken: VNIR reflectance of 100-2200 % (e.g. Petasites 750 nm ~1600 %,
  'white lichen'), while SWIR of the same spectra is ~10-45 %. Most other spectra are flat ~5-12 %
  across 750-2500 nm (target not filling the clip, or plot codes such as 'EC CF5', 'SAG_11_CTL'
  rather than species). Only a handful (e.g. some Toolik shrubs) look like leaves, and they can't
  be selected by metadata. No traits. Not usable for RTM inversion.

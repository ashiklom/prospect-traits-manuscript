format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header:
      text: <script src="plotly.min.js"></script>
    toc: true
    fig-responsive: true
    mermaid:
      theme: neutral
    mainfont: 'system-ui, -apple-system, "Segoe UI", sans-serif'

execute:
  echo: false
  warning: false
  freeze: false

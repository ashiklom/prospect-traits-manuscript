# Priors for RTM and error-model parameters.
#   lognormal: {meanlog, sdlog}; truncnormal: {mu, sigma, lower, upper};
#   uniform: {lower, upper}; halfnormal: {sigma}.
# PROSPECT/LeafSIP constituent priors follow PEcAnRTM::prospect_bt_prior, as in
# prospect-inversion-comparison/config/priors.json. Units: pigments ug cm-2;
# Cw, Cm, Cprot, Ccbc g cm-2; Cbrown arbitrary.
rtm:
  N:      {dist: truncnormal, mu: 1.5, sigma: 1.0, lower: 1.0}
  Cab:    {dist: lognormal, meanlog: 3.6889, sdlog: 0.9}
  Car:    {dist: lognormal, meanlog: 2.3026, sdlog: 1.1}
  Canth:  {dist: lognormal, meanlog: 0.6931, sdlog: 1.5}
  Cbrown: {dist: lognormal, meanlog: -2.3026, sdlog: 1.5}
  Cw:     {dist: lognormal, meanlog: -4.6052, sdlog: 1.0}
  Cm:     {dist: lognormal, meanlog: -4.7105, sdlog: 1.0}
  # PROSPECT-PRO (Feret et al. 2021 calibration ranges: protein ~0.0005-0.003,
  # CBC ~0.002-0.02 g cm-2)
  Cprot:  {dist: lognormal, meanlog: -6.725, sdlog: 1.0}
  Ccbc:   {dist: lognormal, meanlog: -4.962, sdlog: 1.0}
  # LIBERTY (typical values and ranges from rrtm::liberty documentation;
  # thick >= 1 and xu <= 0.06 keep the model in its valid region)
  xu:       {dist: uniform, lower: 0.005, upper: 0.06}
  thick:    {dist: truncnormal, mu: 1.6, sigma: 1.5, lower: 1.0, upper: 10.0}
  baseline: {dist: lognormal, meanlog: -7.6, sdlog: 0.5}
  element:  {dist: lognormal, meanlog: 0.693, sdlog: 0.8}
  c_factor: {dist: lognormal, meanlog: 5.30, sdlog: 0.9}
  w_factor: {dist: lognormal, meanlog: 4.61, sdlog: 0.9}
  l_factor: {dist: lognormal, meanlog: 3.69, sdlog: 0.9}
  p_factor: {dist: lognormal, meanlog: 0.0, sdlog: 0.9}
error:
  sigma0: {dist: halfnormal, sigma: 0.02}
  sigma1: {dist: halfnormal, sigma: 0.1}
  # median 50 nm, 95% 11-220 nm. With a vague prior ell runs to 1e3-1e4 nm
  # (residuals are smoother than OU), sigma and ell trade off and Cm/Cw become
  # unidentified (multimodal chains in the pilot).
  ell:    {dist: lognormal, meanlog: 3.912, sdlog: 0.75}
  kappa:  {dist: lognormal, meanlog: 0.0, sdlog: 0.7}
  rho:    {dist: beta, alpha: 2.0, beta: 2.0}             # rho = 2 * x - 1

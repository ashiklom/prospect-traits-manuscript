[project]
name = "leafrtm"
version = "0.1.0"
description = "Bayesian inversion of leaf radiative transfer models (PROSPECT, LIBERTY, LeafSIP) on harmonized leaf spectra and traits"
authors = [{ name = "Alexey Shiklomanov" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "arviz==1.3.0",
    "duckdb>=1.1",
    "itables==2.9.1",
    "jupyter==1.1.1",
    "nbclient==0.11.0",
    "numba==0.68.0",
    "numpy==2.5.4",
    "nutpie==0.16.11",
    "pandas==3.1.0",
    "pandera>=0.35",
    "pint>=0.24",
    "plotly==7.1.0",
    "pyarrow==26.0.0",
    "pymc==6.3.2",
    "pytensor==3.3.4",
    "pyproj>=3.6",
    "pyyaml>=6",
    "quarto-cli>=1.6",
    "requests>=2.32",
    "scipy==1.18.1",
    "snakemake>=9.0",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = ["pytest>=8", "prosail==2.0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leafrtm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
